version: '3.8'

services:
  # -------------------------------------------------------------
  # Backend Express (Node.js) — Furdunço Café e Cultura
  # -------------------------------------------------------------
  furdunco_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: furdunco_backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: boteco_db
      DB_USER: ${DB_USER:-furdunco_app}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no ambiente}
      DB_NAME: furdunco_db
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no ambiente}
      OCI_ENDPOINT: ${OCI_ENDPOINT:-https://gr88wz9mdro0.compat.objectstorage.sa-saopaulo-1.oraclecloud.com}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_ACCESS_KEY: ${OCI_ACCESS_KEY:-}
      OCI_SECRET_KEY: ${OCI_SECRET_KEY:-}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-https://objectstorage.sa-saopaulo-1.oraclecloud.com/n/gr88wz9mdro0/b/furdunco-fotos/o}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?Configure APP_ALLOWED_ORIGINS no ambiente}
      OCI_BUCKET: furdunco-fotos
      NODE_ENV: production
    ports:
      - "3004:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - default

networks:
  default:
    external: true
    name: cardapio_digital_default
